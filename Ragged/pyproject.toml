[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragged"
version = "0.1.0"
description = "Ask My Docs — local RAG with hybrid retrieval, reranking, and citations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn>=0.54.0",
  "typer>=0.27.3",
  "pydantic>=2.14.1",
  "pyyaml>=6.0.3",
  "jinja2>=3.1.6",
  "httpx>=0.28.1",
  "pymupdf>=2.0",
  "beautifulsoup4>=4.15.0",
  "python-docx>=1.2.0",
  "python-frontmatter>=1.3.0",
  "sentence-transformers>=6.2.0",
  "chromadb>=1.5.9",
  "rank-bm25>=0.2.2",
  "tabulate>=0.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.3",
]

[project.scripts]
ragged = "ragged.cli:app"

[tool.setuptools.packages.find]
include = ["ragged*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
