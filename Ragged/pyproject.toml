[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragged"
version = "0.1.0"
description = "Ask My Docs — local RAG with hybrid retrieval, reranking, and citations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "typer>=0.12.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "httpx>=0.27.0",
  "pymupdf>=1.24.0",
  "beautifulsoup4>=4.12",
  "python-docx>=1.1",
  "python-frontmatter>=1.1",
  "sentence-transformers>=3.0",
  "chromadb>=0.5",
  "rank-bm25>=0.2",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
ragged = "ragged.cli:app"

[tool.setuptools.packages.find]
include = ["ragged*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
